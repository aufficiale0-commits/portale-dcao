*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#0c1523;color:#e9edf2;font:15px/1.6 Georgia,"Times New Roman",serif}
button,input{font:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:270px 1fr}

.brand{padding:0 12px 24px;border-bottom:1px solid var(--line);margin-bottom:22px}.crest{width:46px;height:46px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold2);font-size:23px;margin-bottom:12px}.brand h1{font-size:18px;letter-spacing:2px;color:var(--gold2);margin:0}.brand p{font:10px Arial,sans-serif;letter-spacing:2px;color:var(--muted);margin:5px 0 0}

.content{max-width:1180px;margin:auto;padding:38px 42px 70px}.eyebrow{font:10px Arial,sans-serif;letter-spacing:3px;color:var(--gold);text-transform:uppercase}.hero{padding:38px 0 35px;border-bottom:1px solid var(--line);position:relative}.hero:after{content:"✦";position:absolute;right:4%;top:25px;color:rgba(199,164,91,.22);font-size:110px}.hero h2{font-size:clamp(32px,5vw,54px);line-height:1.08;font-weight:normal;color:#f4efe3;margin:13px 0}.hero p{max-width:650px;color:#b8c2ce;font-size:16px;margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:25px 0 36px}.stat{background:linear-gradient(145deg,#1b2b42,#142237);border:1px solid var(--line);border-radius:10px;padding:17px}.stat strong{display:block;font-size:27px;color:var(--gold2);font-weight:normal}.stat span{font:10px Arial,sans-serif;letter-spacing:1.5px;color:#aab4c1;text-transform:uppercase}
.section-head{display:flex;align-items:end;justify-content:space-between;margin:34px 0 16px}.section-head h3{font-size:25px;font-weight:normal;color:#f4efe3;margin:0}.section-head p{margin:3px 0 0;color:#9ba8b8;font-size:13px}.year-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.year-card{background:linear-gradient(135deg,#1b2b42,#142237);border:1px solid var(--line);border-radius:12px;padding:22px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}.year-card:hover{transform:translateY(-3px);border-color:var(--gold)}.year-card .roman{font-size:42px;color:var(--gold);line-height:1}.year-card h4{font-size:19px;font-weight:normal;margin:9px 0 3px;color:#f5f0e6}.year-card p{color:#aab4c1;margin:0;font-size:13px}.count{font:10px Arial,sans-serif;color:var(--gold2);letter-spacing:1px;margin-top:15px;display:block}
.panel{background:#15243a;border:1px solid var(--line);border-radius:12px;padding:22px;margin-top:18px}.panel h3{font-size:20px;font-weight:normal;margin:0 0 8px;color:#f4efe3}.panel p{color:#aeb8c5;margin:0}.quicklinks{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.quick{background:#101c2e;border:1px solid #2b3a50;padding:14px;border-radius:8px;color:#dfe5eb;text-align:left;cursor:pointer}.quick:hover{border-color:var(--gold)}.quick b{display:block;color:var(--gold2);font-weight:normal;margin-bottom:3px}.quick small{color:#9eabba}
.page-title{margin:10px 0 25px}.page-title h2{font-size:36px;font-weight:normal;margin:8px 0;color:#f4efe3}.page-title p{color:#aab4c1;margin:0;max-width:750px}
.lesson-list{display:grid;gap:10px}.lesson-row{display:flex;align-items:center;gap:16px;background:#17263b;border:1px solid #2b3a50;border-radius:10px;padding:15px 17px;cursor:pointer}.lesson-row:hover{border-color:var(--gold)}.lesson-icon{width:42px;height:42px;flex:0 0 42px;border:1px solid var(--line);border-radius:9px;display:grid;place-items:center;color:var(--gold2);font-size:20px}.lesson-row h4{margin:0;color:#f4efe3;font-size:17px;font-weight:normal}.lesson-row p{margin:3px 0 0;color:#9eabba;font-size:12px}.arrow{margin-left:auto;color:var(--gold);font-size:20px}
.lesson-layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px}.lesson-main,.lesson-aside{background:#15243a;border:1px solid var(--line);border-radius:12px;padding:24px}.lesson-main h2{font-size:34px;font-weight:normal;line-height:1.15;margin:6px 0 8px;color:#f4efe3}.lesson-main .lead{font-size:16px;color:#c0c9d3;border-bottom:1px solid var(--line);padding-bottom:20px}.lesson-main h3{font-size:20px;color:var(--gold2);font-weight:normal;margin:24px 0 7px}.lesson-main p,.lesson-main li{color:#d0d7df}.lesson-main ul{padding-left:20px}.lesson-aside h3{font-size:16px;color:var(--gold2);font-weight:normal;margin:0 0 10px}.aside-block{border-bottom:1px solid var(--line);padding:0 0 15px;margin-bottom:15px}.aside-block:last-child{border:0;margin:0;padding:0}.aside-block p{font-size:13px;color:#b6c0cc;margin:0}.tag{display:inline-block;font:10px Arial,sans-serif;letter-spacing:1px;text-transform:uppercase;border:1px solid var(--line);border-radius:20px;padding:5px 9px;color:var(--gold2);margin:4px 4px 0 0}
.note{background:rgba(199,164,91,.09);border-left:3px solid var(--gold);padding:14px 16px;margin-top:22px;border-radius:0 8px 8px 0}.note strong{display:block;color:var(--gold2);font-weight:normal;margin-bottom:5px}.note p{margin:0;color:#d6dce3;font-size:14px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.btn{border:1px solid var(--line);background:#1b2b42;color:var(--gold2);border-radius:7px;padding:8px 12px;cursor:pointer;font-size:12px}.btn:hover{background:#263954}.empty{color:#aab4c1;padding:25px;border:1px dashed #42516a;border-radius:10px}
footer{border-top:1px solid var(--line);padding:20px 0;margin-top:40px;color:#7f8da0;font:10px Arial,sans-serif;letter-spacing:1px}
.mobile-menu{display:none}
@media(max-width:850px){.shell{grid-template-columns:1fr}aside{position:fixed;z-index:10;width:270px;left:-280px;transition:.25s;box-shadow:10px 0 30px #0008}aside.open{left:0}.mobile-menu{display:inline-block;background:none;border:0;color:var(--gold);font-size:22px;cursor:pointer}.topbar{padding:0 18px}.content{padding:26px 18px 55px}.stats{grid-template-columns:repeat(2,1fr)}.lesson-layout{grid-template-columns:1fr}.quicklinks{grid-template-columns:1fr}.topright{gap:7px}.teacher{display:none}}
@media(max-width:560px){.year-grid{grid-template-columns:1fr}.hero:after{font-size:70px;right:0}.search{width:48vw}.page-title h2{font-size:29px}.lesson-main,.lesson-aside{padding:18px}}

<script>
const lessons = [
{year:1,title:"Fattura, maleficio e maledizione",type:"Fondamenti",desc:"Distinguere le principali categorie di magia ostile.",intro:"Nel primo anno si introducono le tre categorie fondamentali di magia ostile. La distinzione non dipende soltanto dalla formula pronunciata, ma anche dalla natura dell'effetto, dalla sua intensità e dalla durata.",sections:[["Obiettivo della lezione","Imparare a riconoscere le differenze tra fattura, maleficio e maledizione, evitando di usare i termini come sinonimi."],["Definizioni","La fattura produce in genere un effetto circoscritto e temporaneo. Il maleficio è un'azione magica ostile che può provocare un danno più incisivo. La maledizione è tradizionalmente associata a effetti gravi, persistenti o particolarmente difficili da rimuovere."],["Esempi e confronto","Una fattura può alterare momentaneamente un movimento; un maleficio può compromettere una capacità o provocare un danno; una maledizione può lasciare conseguenze durature. Gli esempi servono a ragionare sulle caratteristiche, non a stabilire una regola assoluta."],["Precauzioni","Non classificare un fenomeno basandosi soltanto sul nome. Osservare gli effetti, proteggere le persone coinvolte e chiedere l'intervento di un docente o di personale competente."]],notes:"Aprire la lezione chiedendo agli studenti se conoscono la differenza tra una magia fastidiosa e una magia pericolosa. Far emergere che la gravità non si valuta solo dal dolore immediato: contano anche durata, controllo e conseguenze."},
{year:1,title:"Rictusempra",type:"Incantesimo",desc:"Incantesimo solleticante: effetto, uso e gesto.",intro:"Rictusempra è un incantesimo che provoca una reazione di solletico incontrollabile. Nel percorso didattico viene studiato come esempio di magia dagli effetti apparentemente leggeri, ma da usare con responsabilità.",sections:[["Effetto","Il bersaglio viene colto da una sensazione di solletico che può rendere difficile mantenere la concentrazione e il controllo dei movimenti."],["Formula e gesto","Formula: Rictusempra. Il gesto della bacchetta va eseguito in modo breve e controllato, mantenendo la punta orientata verso il bersaglio designato dal docente."],["Uso responsabile","Non utilizzare l'incantesimo per umiliare, molestare o distrarre qualcuno in situazioni pericolose. Anche un effetto non lesivo può provocare cadute o reazioni impreviste."],["Precauzioni","Esercitarsi soltanto in ambiente controllato, con spazio libero e supervisione. Interrompere l'esercizio se il bersaglio perde l'equilibrio o manifesta disagio."]],notes:"Sottolineare che 'non doloroso' non significa automaticamente 'innocuo'. Chiedere agli studenti di individuare situazioni in cui una risata incontrollata potrebbe diventare pericolosa."},
{year:1,title:"Flipendo",type:"Incantesimo",desc:"Incantesimo di spinta: effetto, uso e gesto.",intro:"Flipendo genera una spinta magica capace di allontanare o sbilanciare un bersaglio. È introdotto come esercizio per comprendere direzione, intensità e controllo.",sections:[["Effetto","Produce una spinta che può far arretrare o perdere l'equilibrio al bersaglio. L'esito varia in base a distanza, postura e ostacoli presenti."],["Formula e gesto","Formula: Flipendo. Il movimento deve essere netto e controllato, accompagnando la pronuncia con una spinta della bacchetta verso il bersaglio previsto."],["Valutazione dell'ambiente","Prima dell'esercizio verificare che dietro al bersaglio non vi siano scale, spigoli, vetri o altri ostacoli. Non dirigere mai la spinta verso persone non coinvolte."],["Precauzioni","Allenamento esclusivamente supervisionato, con bersagli predisposti e intensità adeguata al livello della classe."]],notes:"Far notare la differenza tra la direzione della spinta e la forza impiegata. L'obiettivo didattico è il controllo, non la potenza."},
{year:1,title:"Protego",type:"Incantesimo difensivo",desc:"Incantesimo di protezione e principi di difesa.",intro:"Protego è presentato come incantesimo difensivo fondamentale. La lezione introduce il concetto di barriera magica e la necessità di valutare ciò da cui ci si sta proteggendo.",sections:[["Funzione","Crea una protezione magica che può deviare o arrestare determinati attacchi. Non costituisce una garanzia assoluta contro ogni forma di magia o pericolo."],["Formula e gesto","Formula: Protego. Il gesto deve essere deciso e accompagnato da una chiara intenzione difensiva, mantenendo la bacchetta orientata verso la minaccia."],["Limiti","L'efficacia dipende dalla concentrazione, dalla preparazione, dalla natura dell'attacco e dalle condizioni in cui viene lanciato."],["Precauzioni","Non sostituire la protezione con imprudenza: mantenere distanza, cercare riparo e chiedere aiuto quando necessario."]],notes:"Spiegare che una difesa efficace comprende anche scelta della posizione, osservazione e capacità di ritirarsi. Protego non va descritto come uno scudo infallibile."},
{year:2,title:"Il Molliccio",type:"Creatura",desc:"Riconoscimento, paura e gestione dell'incontro.",intro:"Il Molliccio assume la forma di ciò che spaventa maggiormente chi gli si trova davanti. La lezione si concentra sul riconoscimento della paura e sulla gestione prudente dell'incontro.",sections:[["Caratteristiche","La creatura reagisce alla presenza di una persona manifestando una forma legata alla sua paura. L'aspetto può quindi cambiare da individuo a individuo."],["Riconoscimento","Non basarsi su una forma unica: osservare il contesto e il comportamento anomalo dell'apparizione. Evitare di avvicinarsi per verificare da soli."],["Lavoro di gruppo","Il gruppo mantiene una distanza sicura, ascolta le indicazioni del docente e ragiona su come sostenere chi è spaventato senza deriderlo o forzarlo."],["Precauzioni","Non provocare la creatura e non trasformare l'esercitazione in una prova di coraggio. La sicurezza emotiva e fisica degli studenti viene prima della dimostrazione."]],notes:"Introdurre il tema con tatto: non chiedere agli studenti di rivelare pubblicamente le proprie paure. L'attività può essere svolta su esempi inventati."},
{year:2,title:"Riddikulus",type:"Incantesimo",desc:"Come contrastare il Molliccio attraverso il ridicolo.",intro:"Riddikulus è l'incantesimo studiato per contrastare il Molliccio trasformandone l'aspetto in qualcosa di ridicolo. Richiede immaginazione, concentrazione e controllo emotivo.",sections:[["Funzione","Modifica la manifestazione del Molliccio in una forma comica o assurda, riducendo la presa che la paura esercita sulla persona."],["Formula e gesto","Formula: Riddikulus. La bacchetta accompagna l'intenzione di trasformazione con un movimento chiaro e controllato, secondo la dimostrazione del docente."],["Applicazione didattica","Prima di esercitarsi, gli studenti possono inventare trasformazioni innocue su creature immaginarie, senza usare paure personali dei compagni."],["Precauzioni","Non è uno strumento per ridicolizzare le persone. Se qualcuno manifesta disagio, interrompere l'attività e coinvolgere il docente."]],notes:"Insistere sulla differenza tra ridere della creatura e ridere di una persona. La componente mentale dell'incantesimo è importante quanto il movimento della bacchetta."},
{year:2,title:"Coloshoo",type:"Incantesimo",desc:"Studio dell'incantesimo secondo il programma del corso.",intro:"Questa voce raccoglie il materiale del programma relativo a Coloshoo. La scheda è predisposta per mantenere il contenuto del corso e consentire al docente di integrare la spiegazione e la dimostrazione.",sections:[["Collocazione nel programma","Incantesimo previsto nel secondo anno. La lezione va completata con la descrizione canonica adottata dal docente e con la dimostrazione del gesto."],["Formula e gesto","Formula riportata nel programma: Coloshoo. Prima dell'esercitazione verificare la pronuncia e il movimento previsti dal materiale didattico adottato."],["Conduzione della lezione","Presentare prima lo scopo dell'incantesimo, poi la sequenza del gesto e infine i limiti dell'effetto. Evitare esercizi su persone senza consenso."],["Nota editoriale","La grafia del nome va uniformata in tutto l'archivio sulla base della versione scelta dal corso."]],notes:"Nel materiale precedente il nome compare con una possibile variazione ortografica. Prima di pubblicare la versione definitiva, uniformare la grafia e verificare la descrizione dell'effetto."},
{year:2,title:"Verdimillus",type:"Incantesimo",desc:"Incantesimo del secondo anno: formula e applicazione.",intro:"Scheda di consultazione per Verdimillus, inserito nel programma del secondo anno. La pagina organizza la spiegazione e lascia al docente la possibilità di integrare ulteriori esempi.",sections:[["Obiettivo","Conoscere la collocazione dell'incantesimo nel programma e saper descrivere con precisione l'effetto previsto dal corso."],["Formula e gesto","Formula: Verdimillus. Il docente mostra il movimento della bacchetta e gli studenti ne osservano direzione, ampiezza e controllo."],["Esercitazione","Procedere per passaggi: spiegazione, dimostrazione, ripetizione a vuoto e applicazione su bersaglio predisposto, se appropriato."],["Precauzioni","Non improvvisare bersagli o condizioni di prova. Sospendere l'attività se l'effetto non corrisponde a quello atteso."]],notes:"La scheda mantiene la voce presente nel programma. Integrare in questa sezione la descrizione completa dell'effetto e la dimostrazione già concordata per il corso."},
{year:3,title:"I Troll: forza, territorio e prudenza",type:"Creatura",desc:"Tipologie, segnali di presenza e comportamento sicuro.",intro:"I troll sono creature di corporatura massiccia e forza enorme. La loro goffaggine apparente può trarre in inganno: un singolo colpo può provocare danni importanti e la reazione può essere imprevedibile se viene invaso il loro territorio.",sections:[["Tipologie e caratteristiche","Si distinguono troll di montagna, di foresta e di fiume. Hanno forza eccezionale, temperamento difficile e poca pazienza quando percepiscono un'intrusione. La corporatura massiccia non impedisce loro di provocare danni devastanti."],["Segni di presenza","Impronte profonde, tronchi abbattuti, rumori di trascinamento e odori forti possono suggerire la presenza di un troll. Nessun indizio, preso isolatamente, costituisce una prova assoluta."],["Corridoi e spazi ristretti","In un corridoio o in un passaggio stretto occorre considerare vie di uscita, porte e ostacoli. Non avvicinarsi per confermare un sospetto."],["Comportamento prudente","Non provocare con luci, colpi o oggetti. Evitare esplosioni vicino a pareti portanti. Proteggere le persone, evacuare, non separarsi e lasciare l'intervento a personale addestrato."],["Regola fondamentale","Il troll non è un bersaglio per esercitazioni. La priorità è allontanarsi e mettere in sicurezza le persone."]],notes:"Spiegare che gli indizi ambientali servono a prendere una decisione prudente, non a cercare conferme avvicinandosi. Far ragionare la classe sulle vie di fuga e sull'importanza di non separarsi."},
{year:3,title:"Tarantallegra – Incantesimo Danzante",type:"Fattura",desc:"Movimento incontrollato delle gambe, gesto e rischi.",intro:"Tarantallegra costringe le gambe del bersaglio a muoversi rapidamente in una danza incontrollabile. La perdita di stabilità può trasformare un effetto apparentemente buffo in un pericolo concreto.",sections:[["Effetto","Le gambe si muovono in modo rapido e incontrollato. Il bersaglio può perdere stabilità e avere difficoltà a interrompere il movimento finché l'effetto persiste."],["Formula e gesto","Formula: Tarantallegra. Gesto: due brevi oscillazioni alternate a destra e a sinistra, accompagnate dalla pronuncia."],["Rischi","L'incantesimo è particolarmente pericoloso vicino a scale, balconi e pavimenti sconnessi. La perdita di equilibrio può causare cadute."],["Uso responsabile","Non usarlo per prendere in giro qualcuno o senza consenso. Le esercitazioni devono svolgersi in uno spazio libero e sotto supervisione."]],notes:"Chiedere agli studenti di elencare tre ambienti in cui un movimento incontrollato sarebbe particolarmente rischioso. Ribadire che la natura comica dell'effetto non giustifica l'uso improprio."},
{year:3,title:"Expelliarmus – Incantesimo di Disarmo",type:"Incantesimo offensivo",desc:"Disarmo, limiti dell'effetto e gestione dell'oggetto.",intro:"Expelliarmus fa lasciare al bersaglio la bacchetta o un oggetto impugnato. Può interrompere un attacco, ma non rende automaticamente inoffensiva la persona disarmata.",sections:[["Effetto","L'oggetto impugnato viene strappato dalla presa o fatto cadere. L'esito dipende da distanza, presa, concentrazione e ostacoli."],["Formula e gesto","Formula: Expelliarmus. Gesto: breve scatto diagonale verso l'alto, mirando alla mano armata e non al volto."],["Dopo il disarmo","Controllare dove cade la bacchetta o l'oggetto: potrebbe finire vicino al fuoco, oltre un parapetto o nelle mani di una persona non autorizzata."],["Limiti e precauzioni","Il disarmo non garantisce che l'avversario sia incapace di agire. Mantenere distanza e valutare la situazione prima di avvicinarsi."]],notes:"Far distinguere tra interrompere un attacco e aver risolto il pericolo. La lezione deve includere la gestione dell'oggetto dopo il disarmo, spesso trascurata."},
{year:3,title:"Evertestatum – Incantesimo di Dispersione",type:"Schiantesimo",desc:"Spinta brusca, perdita di equilibrio e valutazione dell'ambiente.",intro:"Evertestatum proietta una forza che può far inciampare o scaraventare all'indietro il bersaglio. Rispetto a Flipendo, l'effetto è più brusco e la perdita di equilibrio meno graduale.",sections:[["Effetto","La forza proiettata può sbilanciare violentemente il bersaglio e provocarne la caduta. Il punto di arrivo è parte essenziale della valutazione del rischio."],["Formula e gesto","Formula adottata dal corso: Evertestatum. Gesto: breve linea diagonale dal basso verso l'alto, con spinta in avanti; pronunciare la formula in un unico tempo."],["Rischi ambientali","Evitare vetri, parapetti, pareti fragili e luoghi affollati. Prima di ogni dimostrazione valutare dove potrebbe finire il bersaglio."],["Nota sui repertori","In alcuni repertori compare la variante grafica “Everte Statum”; il corso mantiene la forma “Evertestatum”."]],notes:"Confrontare Evertestatum con Flipendo: non basta dire che entrambi spingono. Evidenziare la bruschezza dell'effetto e la necessità di considerare la traiettoria e il punto di caduta."},
{year:4,title:"I Licantropi",type:"Creatura",desc:"Condizione, trasformazione, prevenzione e pregiudizi.",intro:"La licantropia è una condizione magica trasmessa dal morso di un lupo mannaro durante la trasformazione. È importante distinguere la persona dalla condizione e valutare i rischi senza alimentare pregiudizi.",sections:[["Condizione e trasformazione","Per la maggior parte del tempo la persona mantiene aspetto umano, memoria e relazioni. Con la luna piena avviene la trasformazione e viene meno il normale controllo."],["Riconoscimento","In forma umana non esiste un segno fisico semplice e certo. Stanchezza, cicatrici o riservatezza non costituiscono prove."],["Prevenzione","La prevenzione si basa sulla conoscenza del ciclo lunare e sulla disponibilità di un luogo protetto."],["Gestione dell'emergenza","Allontanarsi in gruppo, evitare spazi senza uscita e avvisare il personale. Non discutere, trattenere o avvicinarsi alla persona durante una trasformazione."],["Contesto storico","Nel 1890 non è disponibile una pozione comune capace di cancellare i rischi mentali della trasformazione. La lezione deve distinguere le conoscenze dell'epoca dalle interpretazioni moderne."]],notes:"Separare con chiarezza la persona dalla condizione. Correggere eventuali generalizzazioni: stanchezza, cicatrici e riservatezza non sono strumenti diagnostici. Parlare di sicurezza senza trasformare la lezione in una stigmatizzazione."},
{year:4,title:"Le Acromantule",type:"Creatura",desc:"Anatomia, colonie, segnali di presenza e precauzioni.",intro:"L'Acromantula è un ragno magico di dimensioni enormi, capace di linguaggio e ragionamento. La sua intelligenza non deve essere confusa con docilità o sicurezza.",sections:[["Caratteristiche","Originaria delle regioni tropicali del Sud-est asiatico, presenta corpo scuro, numerosi occhi, zampe lunghe, mandibole potenti e rapidità. È dotata di veleno."],["Comportamento sociale","Le Acromantule possono vivere in colonie coordinate. Una creatura parlante non è automaticamente amichevole; una creatura pericolosa non è automaticamente malvagia."],["Segnali di presenza","Reti estese, resti di prede, vibrazioni e fili particolarmente robusti possono indicare la presenza di una colonia."],["Condotta prudente","Ritirarsi senza rompere le reti, mantenere una via di fuga e non avvicinarsi a nidi o uova. Luci ed esplosioni possono irritare la colonia."],["Ferite e intervento","Le ferite devono essere affidate a guaritori. Non improvvisare rimedi, non tentare di raccogliere veleno e non cercare di catturare esemplari."]],notes:"Insistere sul fatto che intelligenza e linguaggio non equivalgono a sicurezza. Presentare i segnali ambientali come indicatori per ritirarsi, non come invito a esplorare il nido."},
{year:4,title:"Confundo – Incantesimo Confundus",type:"Fattura",desc:"Alterazione temporanea di attenzione e giudizio.",intro:"Confundo altera temporaneamente attenzione e giudizio. Può indurre una persona a commettere un errore o a interpretare male una situazione, ma non equivale a un controllo assoluto della volontà.",sections:[["Effetto","Può provocare disorientamento, dimenticanza di un compito o interpretazione errata di informazioni. L'effetto è temporaneo e non coincide con il controllo totale della persona."],["Formula e gesto","Formula: Confundo. Gesto: piccola spirale verso l'interno, con la punta orientata verso il bersaglio."],["Contesto d'uso","In un duello può creare un breve vantaggio o interrompere un'azione. In accordi, esami e decisioni personali viola la fiducia e compromette il consenso."],["Riconoscimento e precauzioni","Prestare attenzione a disorientamento e incongruenze. Non sfruttare la confusione di una persona per ottenere vantaggi o farle prendere decisioni."]],notes:"Aprire una discussione sull'etica: la possibilità di alterare il giudizio altrui è particolarmente grave quando riguarda esami, accordi o scelte personali. Distinguere confusione temporanea da controllo mentale assoluto."},
{year:4,title:"Petrificus – Incantesimo Pietrificante",type:"Fattura",desc:"Immobilizzazione, limiti dell'effetto e protezione del bersaglio.",intro:"Petrificus irrigidisce il corpo e limita o impedisce i movimenti per una durata che dipende dalla forza dell'incantesimo. L'immobilizzazione può interrompere un'aggressione, ma crea anche nuove responsabilità.",sections:[["Effetto","Il corpo viene irrigidito e i movimenti limitati o impediti. La persona non perde necessariamente coscienza o sensibilità."],["Formula e gesto","Formula: Petrificus. Gesto: linea verticale dall'alto verso il basso, con un breve arresto del polso."],["Rischi","Il bersaglio può cadere o restare bloccato in una posizione pericolosa. L'effetto non deve essere considerato una soluzione completa dell'emergenza."],["Dopo l'incantesimo","Proteggere la persona immobilizzata, controllare che non sia esposta a ulteriori pericoli e sciogliere l'effetto con attenzione, quando è sicuro farlo."]],notes:"Sottolineare che immobilizzare una persona non significa metterla automaticamente al sicuro. Gli studenti devono pensare alla posizione del corpo, all'ambiente e all'assistenza necessaria."}
];
const yearInfo={1:["Fondamenti della difesa","Categorie di magia ostile e primi incantesimi di base."],2:["Controllo e gestione della paura","Creature, consapevolezza emotiva e incantesimi di contrasto."],3:["Creature e confronto magico","Riconoscimento dei rischi e incantesimi di disarmo e dispersione."],4:["Creature complesse e fatture","Licantropia, Acromantule e incantesimi che alterano o limitano."],5:["Programma da sviluppare","Spazio predisposto per le future lezioni del quinto anno."]};
let currentYear=null;
const content=document.getElementById('content');
const crumb=document.getElementById('crumb');
const yearName=n=>({1:"Primo anno",2:"Secondo anno",3:"Terzo anno",4:"Quarto anno",5:"Quinto anno"}[n]||"Anno");
function setNav(view){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}
function home(){setNav('home');crumb.textContent='PORTALE DOCENTI / DASHBOARD';content.innerHTML=`
<div class="hero"><div class="eyebrow">Archivio didattico · Area riservata ai docenti</div><h2>Difesa contro<br>le Arti Oscure</h2><p>Un ambiente di lavoro per organizzare programmi, lezioni, creature, incantesimi e materiali didattici. Il contenuto è pensato per la preparazione e la conduzione delle lezioni.</p></div>
<div class="stats"><div class="stat"><strong>4</strong><span>Anni sviluppati</span></div><div class="stat"><strong>${lessons.length}</strong><span>Schede lezione</span></div><div class="stat"><strong>2</strong><span>Aree di consultazione</span></div><div class="stat"><strong>01</strong><span>Archivio docenti</span></div></div>
<div class="section-head"><div><h3>Programmi scolastici</h3><p>Seleziona un anno per consultare le lezioni.</p></div></div>
<div class="year-grid">${[1,2,3,4].map(n=>`<div class="year-card" onclick="showYear(${n})"><div class="roman">${['','I','II','III','IV'][n]}</div><h4>${yearName(n)}</h4><p>${yearInfo[n][1]}</p><span class="count">${lessons.filter(l=>l.year===n).length} LEZIONI DISPONIBILI ↗</span></div>`).join('')}</div>
<div class="panel"><h3>Strumenti del docente</h3><p>Le schede raccolgono spiegazioni, esempi, precauzioni e note per la conduzione della lezione.</p><div class="quicklinks"><button class="quick" onclick="showAll()"><b>⌕ Archivio lezioni</b><small>Consulta tutte le schede in un unico elenco</small></button><button class="quick" onclick="showView('encyclopedia')"><b>❖ Enciclopedia</b><small>Creature e incantesimi organizzati per tipologia</small></button><button class="quick" onclick="showView('materials')"><b>▤ Materiali</b><small>Indice dei materiali didattici esistenti</small></button></div></div>
<footer>DCAO · PORTALE DOCENTI · STRUMENTO DIDATTICO IN EVOLUZIONE</footer>`}
function showYear(n){currentYear=n;setNav('years');crumb.textContent=`PROGRAMMI / ${yearName(n).toUpperCase()}`;let arr=lessons.filter(l=>l.year===n);content.innerHTML=`<div class="page-title"><div class="eyebrow">Programma scolastico</div><h2>${yearName(n)}</h2><p>${yearInfo[n][1]}</p></div>${arr.length?`<div class="lesson-list">${arr.map((l,i)=>lessonRow(l,i)).join('')}</div>`:`<div class="empty">Il programma di questo anno è predisposto. Le lezioni potranno essere aggiunte in seguito.</div>`}<div class="toolbar"><button class="btn" onclick="home()">← Torna alla dashboard</button></div>`}
function lessonRow(l,i){return `<div class="lesson-row" onclick="openLesson(${lessons.indexOf(l)})"><div class="lesson-icon">${l.type.includes('Creatura')?'♜':l.type.includes('Incantesimo')?'✧':'❖'}</div><div><h4>${l.title}</h4><p>${l.type} · ${l.desc}</p></div><span class="arrow">›</span></div>`}
function openLesson(i){let l=lessons[i];crumb.textContent=`${yearName(l.year).toUpperCase()} / ${l.title.toUpperCase()}`;setNav('years');content.innerHTML=`<div class="toolbar"><button class="btn" onclick="showYear(${l.year})">← Torna a ${yearName(l.year)}</button><button class="btn" onclick="window.print()">Stampa scheda</button></div><div class="lesson-layout"><article class="lesson-main"><div class="eyebrow">${yearName(l.year)} · ${l.type}</div><h2>${l.title}</h2><p class="lead">${l.intro}</p>${l.sections.map(s=>`<h3>${s[0]}</h3><p>${s[1]}</p>`).join('')}<div class="note"><strong>✦ Guida per il professore · Note del relatore</strong><p>${l.notes}</p></div></article><aside class="lesson-aside"><div class="aside-block"><h3>Identificazione</h3><p>${l.desc}</p><span class="tag">${yearName(l.year)}</span><span class="tag">${l.type}</span></div><div class="aside-block"><h3>Struttura della scheda</h3><p>Introduzione, spiegazione, applicazione, precauzioni e guida per il docente.</p></div><div class="aside-block"><h3>Uso didattico</h3><p>Materiale di consultazione per preparare e condurre la lezione. Integrare esempi e attività in base alla classe.</p></div></aside></div><footer>DCAO · SCHEDA DIDATTICA · ${l.title.toUpperCase()}</footer>`}
function showAll(){setNav('alllessons');crumb.textContent='CONSULTAZIONE / TUTTE LE LEZIONI';content.innerHTML=`<div class="page-title"><div class="eyebrow">Archivio generale</div><h2>Tutte le lezioni</h2><p>Elenco completo delle schede attualmente inserite nel portale.</p></div><div class="lesson-list">${lessons.map((l,i)=>lessonRow(l,i)).join('')}</div>`}
function showView(view){setNav(view);if(view==='home')return home();if(view==='years'){crumb.textContent='PROGRAMMI SCOLASTICI';content.innerHTML=`<div class="page-title"><div class="eyebrow">Percorsi didattici</div><h2>Programmi scolastici</h2><p>Consulta i contenuti suddivisi per anno.</p></div><div class="year-grid">${[1,2,3,4,5].map(n=>`<div class="year-card" onclick="showYear(${n})"><div class="roman">${['','I','II','III','IV','V'][n]}</div><h4>${yearName(n)}</h4><p>${yearInfo[n][1]}</p><span class="count">${lessons.filter(l=>l.year===n).length} LEZIONI ↗</span></div>`).join('')}</div>`}
if(view==='encyclopedia'){crumb.textContent='ENCICLOPEDIA DCAO';let types=[...new Set(lessons.map(l=>l.type))];content.innerHTML=`<div class="page-title"><div class="eyebrow">Repertorio disciplinare</div><h2>Enciclopedia DCAO</h2><p>Indice tematico ricavato dalle lezioni già preparate. Seleziona una voce per aprire la relativa scheda.</p></div>${types.map(t=>`<div class="panel"><h3>${t}</h3><div class="lesson-list">${lessons.map((l,i)=>({l,i})).filter(x=>x.l.type===t).map(x=>lessonRow(x.l,x.i)).join('')}</div></div>`).join('')}`}
if(view==='materials'){crumb.textContent='MATERIALE DIDATTICO';content.innerHTML=`<div class="page-title"><div class="eyebrow">Risorse del docente</div><h2>Materiale didattico</h2><p>Indice dei materiali preparati e delle risorse da collegare al portale.</p></div><div class="panel"><h3>Presentazioni PowerPoint esistenti</h3><p>Le presentazioni già realizzate costituiscono la base dei contenuti di questo archivio.</p><div class="lesson-list" style="margin-top:16px"><div class="lesson-row"><div class="lesson-icon">▤</div><div><h4>Primo e secondo anno</h4><p>Presentazione docente · 24 slide · note del relatore</p></div><span class="tag">PPTX</span></div><div class="lesson-row"><div class="lesson-icon">▤</div><div><h4>Terzo e quarto anno</h4><p>Presentazione docente · 16 slide · note del relatore</p></div><span class="tag">PPTX</span></div></div></div><div class="panel"><h3>Sezioni da integrare</h3><p>Area predisposta per schede PDF, verifiche, esercitazioni, immagini e ulteriori approfondimenti. I file potranno essere collegati nella versione pubblicata.</p></div>`}
}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.view==='alllessons')showAll();else showView(b.dataset.view);document.getElementById('sidebar').classList.remove('open')}));
document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));
document.getElementById('search').addEventListener('input',e=>{let q=e.target.value.trim().toLowerCase();if(!q){home();return}let found=lessons.map((l,i)=>({l,i})).filter(x=>(x.l.title+' '+x.l.desc+' '+x.l.type+' '+x.l.intro).toLowerCase().includes(q));crumb.textContent='RICERCA / RISULTATI';content.innerHTML=`<div class="page-title"><div class="eyebrow">Ricerca nell'archivio</div><h2>Risultati</h2><p>${found.length} schede trovate per “${q.replaceAll('<','&lt;')}”.</p></div>${found.length?`<div class="lesson-list">${found.map(x=>lessonRow(x.l,x.i)).join('')}</div>`:'<div class="empty">Nessuna scheda corrispondente. Prova con un altro termine.</div>'}`});
home();
</script>
