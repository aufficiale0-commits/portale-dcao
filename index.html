<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DCAO · Portale docenti</title><style>
:root{--bg:#091526;--side:#101f34;--panel:#172941;--gold:#c9a45c;--pale:#ead39c;--txt:#edf0f4;--muted:#aeb9c8;--line:#34445a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.65 Georgia,serif}a{color:var(--pale);text-decoration:none}a:hover{text-decoration:underline}.side{position:fixed;inset:0 auto 0 0;width:238px;background:var(--side);border-right:1px solid var(--line);padding:26px 17px;overflow:auto}.brand{font-size:25px;letter-spacing:3px;color:var(--pale)}.sub,.label,.eyebrow{font:10px Arial;letter-spacing:2px;color:var(--gold);text-transform:uppercase}.sub{margin:4px 0 25px}.label{margin:20px 8px 5px}.side a{display:block;padding:8px 9px;border-radius:5px;color:#dce3ed;font:14px Arial}.side a:hover{background:#20344e;text-decoration:none}.main{margin-left:238px;padding:46px clamp(20px,6vw,78px);max-width:1250px}h1{font-size:clamp(32px,4vw,48px);line-height:1.15;font-weight:normal;color:var(--pale);margin:12px 0}h2,h3{font-weight:normal;color:var(--pale)}h2{margin:28px 0 8px}p{max-width:830px;color:#d5dce5}.lead{font-size:19px;color:#c3ccd8}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:22px 0}.card,.item{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:17px}.card p{font-size:14px;color:var(--muted)}.list{display:grid;gap:9px;max-width:850px}.item{display:flex;justify-content:space-between;gap:12px}.item strong{font-weight:normal}.item span{font:12px Arial;color:var(--muted)}.note{border-left:2px solid var(--gold);padding:12px 17px;background:#111f31;color:#cbd4df;max-width:850px}.foot{margin-top:55px;color:#7f8da0;font:10px Arial;letter-spacing:1px}@media(max-width:740px){.side{position:relative;width:auto;padding:16px}.side nav{display:grid;grid-template-columns:repeat(2,1fr)}.label{grid-column:1/-1}.main{margin:0;padding:26px 18px}}
</style></head><body><aside class="side"><div class="brand">✦ DCAO</div><div class="sub">PORTALE DIDATTICO · DOCENTI</div><nav><div class="label">Portale</div><a href="?page=home">⌂ Dashboard</a><a href="?page=programmi">Programmi scolastici</a><a href="?page=archivio">Archivio lezioni</a><div class="label">Consultazione</div><a href="?page=enciclopedia">Enciclopedia</a><a href="?page=materiali">Materiale didattico</a><div class="label">Anni scolastici</div><a href="?page=anno-1">Primo anno</a><a href="?page=anno-2">Secondo anno</a><a href="?page=anno-3">Terzo anno</a><a href="?page=anno-4">Quarto anno</a><a href="?page=anno-5">Quinto anno</a></nav></aside><main class="main" id="app"></main><script>
const lessons=[["Fattura, maleficio e maledizione",1,"fattura-maleficio-maledizione"],["Rictusempra",1,"rictusempra"],["Flipendo",1,"flipendo"],["Protego",1,"protego"],["Molliccio e Riddikulus",2,"molliccio-riddikulus"],["Coloshoo",2,"coloshoo"],["Verdimillus",2,"verdimillus"],["Troll",3,"troll"],["Tarantallegra",3,"tarantallegra"],["Expelliarmus",3,"expelliarmus"],["Evertestatum",3,"evertestatum"],["Licantropi",4,"licantropi"],["Acromantule",4,"acromantule"],["Confundo",4,"confundo"],["Petrificus",4,"petrificus"]];
const details={
rictusempra:["Rictusempra provoca nel bersaglio una sensazione intensa di solletico, rendendo difficile mantenere concentrazione e controllo dei movimenti.","Il bersaglio è colto da risate e spasmi involontari. L'effetto è temporaneo, ma può risultare disorientante.","Formula: Rictusempra. Gesto: movimento deciso e controllato della bacchetta verso il bersaglio, mantenendo distanza di sicurezza.","Studiare l'incantesimo come esempio di disturbo. In esercitazione usare soltanto bersagli predisposti o simulazioni concordate.","Non usarlo per umiliare o intimidire. Evitare scale, fuoco, oggetti fragili e situazioni che richiedono equilibrio.","Valutare precisione, controllo dell'intenzione e capacità di interrompere l'esercizio al segnale del docente."],
flipendo:["Flipendo è un incantesimo di spinta, utile per comprendere gli effetti della forza magica e il controllo della distanza.","Può respingere il bersaglio e provocare perdita di equilibrio.","Formula: Flipendo. Gesto e direzione vanno dimostrati in modo controllato dal docente.","Analizzare traiettoria, spazio libero e possibili conseguenze prima di ogni dimostrazione.","Non puntare verso persone, scale o oggetti fragili; considerare sempre il rischio di caduta.","Verificare che gli studenti sappiano descrivere traiettoria e rischi prima di procedere."],
protego:["Protego è un incantesimo difensivo che crea uno scudo protettivo contro determinati attacchi.","La protezione dipende da concentrazione, tempismo e intensità dell'attacco.","Formula: Protego. La postura deve essere stabile e il gesto controllato.","Studiare il principio dello scudo attraverso esempi teorici e dimostrazioni concordate.","Non considerare lo scudo una garanzia assoluta; mantenere vie di allontanamento e protezione.","Valutare postura, concentrazione e comprensione dei limiti della difesa."]
};
function el(tag,txt){return '<'+tag+'>'+txt+'</'+tag+'>'}
function render(){let p=new URLSearchParams(location.search).get('page')||'home',app=document.getElementById('app'),years=['Primo','Secondo','Terzo','Quarto','Quinto'];let body='';
if(p==='home')body='<div class="eyebrow">Area professori</div><h1>Difesa contro le Arti Oscure</h1><p class="lead">Portale didattico per organizzare programmi, lezioni e materiali del corso.</p><div class="grid"><a class="card" href="?page=programmi"><h3>Programmi scolastici</h3><p>Percorsi dal primo al quinto anno.</p></a><a class="card" href="?page=archivio"><h3>Archivio lezioni</h3><p>Indice delle schede didattiche.</p></a><a class="card" href="?page=enciclopedia"><h3>Enciclopedia</h3><p>Creature, concetti e incantesimi.</p></a><a class="card" href="?page=materiali"><h3>Materiale didattico</h3><p>Risorse e appunti per docenti.</p></a></div>';
else if(p==='programmi')body='<div class="eyebrow">Percorsi scolastici</div><h1>Programmi scolastici</h1><p class="lead">Scegli l’anno per aprire il suo elenco autonomo di lezioni.</p><div class="grid">'+years.map((x,i)=>'<a class="card" href="?page=anno-'+(i+1)+'"><h3>'+x+' anno</h3><p>Apri programma →</p></a>').join('')+'</div>';
else if(p.startsWith('anno-')){let y=Number(p.slice(5)),ls=lessons.filter(x=>x[1]===y);body='<div class="eyebrow">Programmi scolastici</div><h1>'+years[y-1]+' anno</h1><p class="lead">Elenco delle lezioni previste per l’anno.</p><div class="list">'+(ls.length?ls.map(x=>'<a class="item" href="?page=lezione-'+x[2]+'"><strong>'+x[0]+'</strong><span>Apri →</span></a>').join(''):'<div class="note">Programma da completare.</div>')+'</div>'}
else if(p==='archivio')body='<div class="eyebrow">Indice generale</div><h1>Archivio lezioni</h1><div class="list">'+lessons.map(x=>'<a class="item" href="?page=lezione-'+x[2]+'"><strong>'+x[0]+'</strong><span>Anno '+x[1]+'</span></a>').join('')+'</div>';
else if(p==='enciclopedia')body='<div class="eyebrow">Consultazione</div><h1>Enciclopedia</h1><p class="lead">Repertorio di creature, concetti e incantesimi affrontati durante il corso.</p><div class="grid"><div class="card"><h3>Concetti magici</h3><p>Classificazione e responsabilità nell’uso della magia.</p></div><div class="card"><h3>Creature</h3><p>Troll, licantropi e acromantule.</p></div><div class="card"><h3>Incantesimi</h3><p>Formule, applicazioni e precauzioni.</p><a href="?page=archivio">Apri archivio →</a></div></div>';
else if(p==='materiali')body='<div class="eyebrow">Risorse per docenti</div><h1>Materiale didattico</h1><p class="lead">Area di supporto per organizzare risorse e appunti.</p><div class="grid"><div class="card"><h3>Preparazione</h3><p>Obiettivi, prerequisiti e tracce della lezione.</p></div><div class="card"><h3>Esercitazioni</h3><p>Attività guidate e simulazioni controllate.</p></div><div class="card"><h3>Valutazione</h3><p>Osservazioni e note del docente.</p></div></div>';
else if(p.startsWith('lezione-')){let slug=p.slice(8),x=lessons.find(z=>z[2]===slug);if(x){let d=details[slug]||['La lezione introduce '+x[0]+' e ne inquadra le caratteristiche nel programma di Difesa contro le Arti Oscure.','Descrizione ed effetti da approfondire sulla base del materiale didattico del corso.','Formula, pronuncia e gesto da verificare sulla fonte di riferimento.','Affrontare l’argomento con spiegazione guidata e attività teoriche controllate.','Non attribuire proprietà non documentate. Valutare ambiente, distanza e sicurezza.','Integrare la scheda con gli appunti del docente e con la fonte adottata per la classe.'];body='<div class="eyebrow">Lezione · '+years[x[1]-1]+' anno</div><h1>'+x[0]+'</h1><p class="lead">'+d[0]+'</p>'+['Effetto','Formula e gesto','Modalità d’uso','Rischi e precauzioni'].map((h,i)=>'<h2>'+h+'</h2><p>'+d[i+1]+'</p>').join('')+'<h2>Note del professore</h2><div class="note">'+d[5]+'</div><p><a href="?page=anno-'+x[1]+'">← Torna al programma dell’anno</a></p>'}else body='<h1>Scheda non trovata</h1>'}
else body='<h1>Pagina non trovata</h1>';
app.innerHTML=body+'<div class="foot">DIFESA CONTRO LE ARTI OSCURE · AREA DOCENTI</div>'}
document.addEventListener('click',e=>{let a=e.target.closest('a');if(a&&a.origin===location.origin&&a.search){e.preventDefault();history.pushState({},'',a.href);render();window.scrollTo(0,0)}});window.addEventListener('popstate',render);render();
</script></body></html>
